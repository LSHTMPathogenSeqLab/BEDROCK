name: methylation-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - biopython
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - scipy
  - pyranges
  - pybedtools
  - bedtools
  - tqdm
  - ont-modkit>=0.4   # pileup from modBAMs + motif search (figure 7)
  - samtools          # BAM index + depth when starting from modBAMs
